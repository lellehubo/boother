<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9BC85"/>
      <stop offset="0.5" stop-color="#C68A4C"/>
      <stop offset="1" stop-color="#7C4A22"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f5"/>
      <stop offset="0.5" stop-color="#c3c6c5"/>
      <stop offset="1" stop-color="#6E7271"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4140"/>
      <stop offset="1" stop-color="#1b1d1f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eceeed"/>
      <stop offset="1" stop-color="#7d817f"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#c8e4f6"/>
      <stop offset="0.34" stop-color="#5b93bf"/>
      <stop offset="0.72" stop-color="#1e3a54"/>
      <stop offset="1" stop-color="#0a1622"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed bakgrund — maskable-säker, ingen transparens (funkar även för iOS) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="110" rx="300" ry="180" fill="#ffffff" opacity="0.12"/>

  <!-- Kamerakropp -->
  <rect x="96" y="182" width="320" height="198" rx="30" fill="url(#body)"/>
  <!-- Topplatta i krom -->
  <rect x="120" y="156" width="272" height="42" rx="13" fill="url(#chrome)"/>
  <rect x="120" y="156" width="272" height="42" rx="13" fill="none" stroke="#5c605e" stroke-width="1.5"/>
  <!-- Läder/krom-söm -->
  <rect x="96" y="206" width="320" height="12" fill="#9a6a38" opacity="0.85"/>
  <!-- Toppens glansstreck -->
  <rect x="112" y="188" width="288" height="6" rx="3" fill="#ffffff" opacity="0.10"/>

  <!-- Sökarfönster -->
  <rect x="138" y="164" width="44" height="26" rx="5" fill="#1b2733"/>
  <circle cx="160" cy="177" r="8" fill="#8fb9d6"/>
  <!-- Grön avtryckare — koppling till appens utlösare -->
  <circle cx="362" cy="156" r="16" fill="#2E9E4A" stroke="#cfd2d1" stroke-width="4"/>
  <!-- Röd inspelnings-/statuslampa -->
  <circle cx="360" cy="244" r="8" fill="#e0553f"/>

  <!-- Objektiv — koncentriska ringar -->
  <circle cx="256" cy="290" r="90" fill="url(#ring)"/>
  <circle cx="256" cy="290" r="90" fill="none" stroke="#5c605e" stroke-width="2"/>
  <circle cx="256" cy="290" r="74" fill="#17181a"/>
  <circle cx="256" cy="290" r="58" fill="url(#ring)"/>
  <circle cx="256" cy="290" r="44" fill="#0c0e11"/>
  <circle cx="256" cy="290" r="36" fill="url(#glass)"/>
  <!-- Specularreflex -->
  <ellipse cx="240" cy="274" rx="13" ry="8" fill="#ffffff" opacity="0.6"/>
</svg>
